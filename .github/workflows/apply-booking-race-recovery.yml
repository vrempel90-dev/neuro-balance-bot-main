name: Apply booking race recovery

on:
  push:
    branches:
      - refactor/polyglot-brain-contract
  pull_request:
    branches:
      - main

concurrency:
  group: booking-race-recovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      CRM_BOT_SECRET: test
      CRM_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded booking recovery migration
        run: python scripts/apply_booking_race_recovery.py
      - name: Compile
        run: python -m py_compile dialog.py crm.py ai.py main.py state.py tests/test_production_booking_flow.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Booking race recovery contract
        run: pytest -q tests/test_booking_race_recovery_contract.py
      - name: Existing booking regression contract
        run: pytest -q tests/test_production_booking_flow.py
      - name: Slot and reschedule safety
        run: |
          pytest -q tests/test_polyglot_slot_contract.py
          pytest -q tests/test_post_booking_reschedule_contract.py
      - name: RU-KK and hallucination regressions
        run: |
          pytest -q tests/test_language_switching.py
          pytest -q tests/test_bilingual_hallucination_guards.py
      - name: Remove one-shot machinery
        run: |
          rm -f scripts/apply_booking_race_recovery.py
          rm -f .github/workflows/apply-booking-race-recovery.yml
      - name: Commit verified recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: recover booking slot races without false confirmation"
          git pull --rebase origin refactor/polyglot-brain-contract
          git push origin HEAD:refactor/polyglot-brain-contract
