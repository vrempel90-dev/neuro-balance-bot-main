name: NeuroBalance Doctor and Language Regression

on:
  push:
    branches:
      - fix/explicit-doctor-selection
  pull_request:
    paths:
      - "agent.py"
      - "dialog.py"
      - "language_guard.py"
      - "tests/test_doctor_language_selection.py"
      - "tests/test_crm_phone_admission.py"
      - "tests/test_admission.py"
      - "crm.py"
      - "admission.py"

jobs:
  doctor-language:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q agent.py dialog.py language_guard.py state.py
      - name: Doctor + language tests
        run: python -m pytest -q tests/test_doctor_language_selection.py tests/test_crm_phone_admission.py tests/test_admission.py
