name: Claude Repair Dashboard Contract

on:
  pull_request:
    paths:
      - "agent.py"
      - "dialog.py"
      - "main.py"
      - "admission.py"
      - "crm.py"
      - "state.py"
      - "tests/test_gpt_first_agent_booking.py"
      - "tests/test_gpt_first_conversation.py"
      - "tests/test_night_new_leads_production_fix.py"
      - "tests/test_wazzup_production_webhook.py"
      - "agent.py"
      - "dialog.py"
      - "main.py"
      - "admission.py"
      - "crm.py"
      - "state.py"
      - "tests/test_gpt_first_agent_booking.py"
      - "tests/test_gpt_first_conversation.py"
      - "tests/test_night_new_leads_production_fix.py"
      - "tests/test_wazzup_production_webhook.py"
      - "repair_app.py"
      - "repair_status.py"
      - "repair_service.py"
      - "repair_live.py"
      - "repair_observer.py"
      - "live_main.py"
      - "tests/test_repair_status.py"
      - "tests/test_claude_live_new_leads.py"
      - ".github/workflows/repair-dashboard-contract.yml"
      - ".github/workflows/claude-real-repair.yml"
  push:
    branches: [main]
    paths:
      - "repair_app.py"
      - "repair_status.py"
      - "repair_service.py"
      - "repair_live.py"
      - "repair_observer.py"
      - "live_main.py"
      - "tests/test_repair_status.py"
      - "tests/test_claude_live_new_leads.py"
      - ".github/workflows/repair-dashboard-contract.yml"
      - ".github/workflows/claude-real-repair.yml"

permissions:
  contents: read

jobs:
  core-booking-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile core assistant modules
        run: python -m py_compile agent.py dialog.py main.py admission.py crm.py state.py
      - name: Run core booking regression tests
        run: |
          python -m pytest -q \
            tests/test_gpt_first_agent_booking.py \
            tests/test_gpt_first_conversation.py \
            tests/test_night_new_leads_production_fix.py \
            tests/test_wazzup_production_webhook.py

  dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile repair modules
        run: python -m py_compile repair_status.py repair_app.py repair_service.py repair_live.py repair_observer.py live_main.py
      - name: Run repair regression tests
        run: python -m pytest -q tests/test_repair_status.py tests/test_claude_live_new_leads.py
