name: One-shot CRM confirmation hotfix

on:
  push:
    branches:
      - hotfix/crm-confirmation-after-pr101

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/crm-confirmation-after-pr101
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Apply fail-closed CRM confirmation guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('crm.py')
          text = path.read_text(encoding='utf-8')
          old = '''    data[CRM_RESPONSE_KEYS_FIELD] = sorted(str(k) for k in data)\n\n    data.setdefault("ok", True)\n    data.setdefault("status", "Записан")\n    data.setdefault("date", date)\n    data.setdefault("timeStart", time_start)\n    if doctor_name:\n        data.setdefault("doctorName", doctor_name)\n\n    return data\n'''
          new = '''    crm_response_keys = sorted(str(k) for k in data)\n    data[CRM_RESPONSE_KEYS_FIELD] = crm_response_keys\n\n    # Fail closed before compatibility defaults are added. Legacy callers used\n    # to treat any HTTP 2xx body as a successful booking and could therefore\n    # tell a patient \"Вы записаны\" for responses such as {} or\n    # {\"message\": \"queued\"}. Only explicit CRM evidence may leave this\n    # function as a successful return. Ambiguous 2xx responses raise CRMError;\n    # both GPT-first and legacy callers then keep the booking claim uncertain\n    # and must not confirm the appointment.\n    confirmed = any(\n        data.get(key) is True\n        for key in ("ok", "success", "booked", "created")\n        if key in crm_response_keys\n    ) or any(\n        str(data.get(key) or "").strip()\n        for key in ("id", "appointmentId", "bookingId")\n        if key in crm_response_keys\n    )\n    if not confirmed:\n        logger.warning(\n            "CRM book returned HTTP 2xx without explicit booking confirmation; keys=%s",\n            crm_response_keys,\n        )\n        raise CRMError("CRM book response unconfirmed: HTTP 2xx without explicit booking confirmation")\n\n    data.setdefault("ok", True)\n    data.setdefault("status", "Записан")\n    data.setdefault("date", date)\n    data.setdefault("timeStart", time_start)\n    if doctor_name:\n        data.setdefault("doctorName", doctor_name)\n\n    return data\n'''
          if old not in text:
              raise SystemExit('Expected crm.py booking block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one booking block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_crm_booking_confirmation_hotfix.py')
          test.write_text('''from __future__ import annotations\n\nimport httpx\nimport pytest\n\nimport crm\n\n\nclass _FakeClient:\n    def __init__(self, response: httpx.Response):\n        self.response = response\n\n    async def post(self, *args, **kwargs):\n        return self.response\n\n\ndef _response(payload: dict) -> httpx.Response:\n    return httpx.Response(\n        200,\n        json=payload,\n        request=httpx.Request("POST", "https://crm.test/api/bot/book"),\n    )\n\n\n@pytest.mark.asyncio\n@pytest.mark.parametrize("payload", [{}, {"message": "queued"}, {"status": "Записан"}])\nasync def test_book_appointment_rejects_ambiguous_2xx(monkeypatch, payload):\n    monkeypatch.setattr(crm, "_client", lambda: _FakeClient(_response(payload)))\n\n    with pytest.raises(crm.CRMError, match="unconfirmed"):\n        await crm.book_appointment(\n            patient_name="Тест",\n            phone="77000000000",\n            doctor_login="doctor.test",\n            doctor_name="Тестовый врач",\n            date="2026-08-25",\n            time_start="10:00",\n        )\n\n\n@pytest.mark.asyncio\nasync def test_book_appointment_accepts_explicit_crm_confirmation(monkeypatch):\n    payload = {"success": True, "appointmentId": "apt-123"}\n    monkeypatch.setattr(crm, "_client", lambda: _FakeClient(_response(payload)))\n\n    result = await crm.book_appointment(\n        patient_name="Тест",\n        phone="77000000000",\n        doctor_login="doctor.test",\n        doctor_name="Тестовый врач",\n        date="2026-08-25",\n        time_start="10:00",\n    )\n\n    assert result["success"] is True\n    assert result["appointmentId"] == "apt-123"\n    assert set(result[crm.CRM_RESPONSE_KEYS_FIELD]) == {"success", "appointmentId"}\n''', encoding='utf-8')

      - name: Validate hotfix
        run: |
          python -m py_compile crm.py
          python -m pytest -q tests/test_crm_booking_confirmation_hotfix.py
          python -m pytest -q tests/test_gpt_first_agent_booking.py tests/test_external_contracts_unchanged.py

      - name: Commit only production fix and regression test
        run: |
          rm .github/workflows/one-shot-crm-confirmation-hotfix.yml
          git config user.name "Neuro Balance Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add crm.py tests/test_crm_booking_confirmation_hotfix.py .github/workflows/one-shot-crm-confirmation-hotfix.yml
          git commit -m "fix: fail closed on unconfirmed CRM booking responses"
          git push origin hotfix/crm-confirmation-after-pr101
