name: NeuroBalance Agents SDK regression

on:
  push:
    branches:
      - feature/openai-agents-sdk-neurobalance
  pull_request:
    paths:
      - "agents_sdk_runtime.py"
      - "response_policy.py"
      - "agent.py"
      - "dialog.py"
      - "config.py"
      - "clinic_info.py"
      - "requirements.txt"
      - "tests/test_sdk_migration.py"

jobs:
  sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile runtime
        run: python -m compileall -q agents_sdk_runtime.py response_policy.py agent.py dialog.py
      - name: Run SDK safety regression tests
        run: pytest -q tests/test_sdk_migration.py
