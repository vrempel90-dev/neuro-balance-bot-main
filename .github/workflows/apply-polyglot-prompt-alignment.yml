name: Apply Polyglot prompt alignment

on:
  push:
    branches:
      - refactor/polyglot-brain-contract
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded migration
        run: python scripts/apply_polyglot_prompt_alignment.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run prompt and brain regression tests
        env:
          OPENAI_API_KEY: ''
          CRM_BOT_SECRET: test
        run: |
          pytest -q \
            tests/test_prompt_source_of_truth_contract.py \
            tests/test_brain_language_contract.py \
            tests/test_bilingual_language_guard.py \
            tests/test_bilingual_hallucination_guards.py \
            tests/test_answer_language_and_shape.py

      - name: Remove one-shot migration machinery
        run: |
          rm -f scripts/apply_polyglot_prompt_alignment.py
          rm -f .github/workflows/apply-polyglot-prompt-alignment.yml

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make canonical clinic prompt authoritative"
          git push origin HEAD:refactor/polyglot-brain-contract
