name: Apply Polyglot change of mind

on:
  push:
    branches:
      - refactor/polyglot-brain-contract
  pull_request:
    branches:
      - main

concurrency:
  group: polyglot-change-of-mind
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      CRM_BOT_SECRET: test
      CRM_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded change-of-mind migration
        run: python scripts/apply_polyglot_change_of_mind.py
      - name: Compile
        run: python -m py_compile dialog.py ai.py main.py state.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Change-of-mind contract
        run: pytest -q tests/test_polyglot_change_of_mind_contract.py
      - name: Booking and slot regressions
        run: |
          pytest -q tests/test_production_booking_flow.py
          pytest -q tests/test_polyglot_slot_contract.py
          pytest -q tests/test_booking_race_recovery_contract.py
          pytest -q tests/test_post_booking_reschedule_contract.py
      - name: Brain and bilingual regressions
        run: |
          pytest -q tests/test_brain_before_keyword_branches.py
          pytest -q tests/test_multiturn_bilingual_flow.py
          pytest -q tests/test_language_switching.py
      - name: Remove one-shot machinery
        run: |
          rm -f scripts/apply_polyglot_change_of_mind.py
          rm -f .github/workflows/apply-polyglot-change-of-mind.yml
      - name: Commit verified change-of-mind flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: allow safe date and time changes mid-booking"
          git pull --rebase origin refactor/polyglot-brain-contract
          git push origin HEAD:refactor/polyglot-brain-contract
