name: Claude Real Wazzup Repair

on:
  schedule:
    # Asia/Almaty is UTC+5. 15:00-02:59 UTC == 20:00-07:59 local.
    - cron: "*/15 15-23 * * *"
    - cron: "*/15 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-real-wazzup-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_REPAIR_GATEWAY_URL: https://neuro-claude-repair-production.up.railway.app
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce 20:00-08:00 Asia/Almaty window
        id: window
        shell: bash
        run: |
          ACTIVE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          h = datetime.now(ZoneInfo("Asia/Almaty")).hour
          print("true" if h >= 20 or h < 8 else "false")
          PY
          )
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "Night repair window active: $ACTIVE"

      - name: Skip while another automated repair PR is open
        if: steps.window.outputs.active == 'true'
        id: existing
        shell: bash
        run: |
          COUNT=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/real-wazzup-"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Open automated repair PRs: $COUNT"

      - name: Set up Python
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Set up Node
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Request GitHub OIDC token for Railway gateway
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        shell: bash
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=neuro-claude-repair")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")
          echo "::add-mask::$TOKEN"
          echo "CLAUDE_GATEWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Read only recent REAL Wazzup production events
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        id: events
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${CLAUDE_GATEWAY_TOKEN}" \
            "${CLAUDE_REPAIR_GATEWAY_URL}/real-events?minutes=16" \
            -o /tmp/neuro-real-events.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/neuro-real-events.json', encoding='utf-8'))
          events = data.get('events') or []
          signals = int(data.get('signal_count') or 0)
          by_conv = {}
          for event in events:
              by_conv.setdefault(event.get('conversation_id'), []).append(event)
          sequence_signal = 0
          for seq in by_conv.values():
              answers = [
                  str(e.get('payload', {}).get('answer_preview') or '').strip()
                  for e in seq if e.get('event') == 'dialog_result'
              ]
              answers = [a for a in answers if a]
              if len(answers) >= 2 and any(answers.count(a) >= 2 for a in set(answers)):
                  sequence_signal += 1
              steps = [
                  str(e.get('payload', {}).get('step') or '').strip()
                  for e in seq if e.get('event') == 'dialog_result'
              ]
              steps = [s for s in steps if s]
              if len(steps) >= 3 and len(set(steps[-3:])) == 1:
                  sequence_signal += 1
          actionable = bool(events) and (signals > 0 or sequence_signal > 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"count={len(events)}\n")
              f.write(f"signals={signals}\n")
              f.write(f"sequence_signals={sequence_signal}\n")
              f.write(f"actionable={'true' if actionable else 'false'}\n")
          print(f"real events={len(events)} explicit signals={signals} sequence signals={sequence_signal}")
          PY

      - name: Let Claude investigate and edit only internal brain files
        if: steps.events.outputs.actionable == 'true'
        shell: bash
        env:
          ANTHROPIC_BASE_URL: ${{ env.CLAUDE_REPAIR_GATEWAY_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ env.CLAUDE_GATEWAY_TOKEN }}
        run: |
          unset ANTHROPIC_API_KEY || true
          cat /tmp/neuro-real-events.json | claude -p "$(cat .github/claude-real-repair-prompt.md)" \
            --permission-mode acceptEdits \
            --max-turns 24 \
            --output-format text \
            --allowedTools \
              "Read" \
              "Edit" \
              "Write" \
              "Grep" \
              "Glob" \
              "Bash(python:*)" \
              "Bash(pytest:*)" \
              "Bash(git diff:*)" \
              "Bash(git status:*)" \
            | tee /tmp/claude-repair-result.txt

      - name: Enforce repair scope
        if: steps.events.outputs.actionable == 'true'
        id: scope
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Claude found no reproducible real bug; no files changed."
            exit 0
          fi

          echo "Changed paths:"
          git status --porcelain
          FORBIDDEN=0
          while IFS= read -r path; do
            case "$path" in
              dialog.py|ai.py|bot_tools.py|language_guard.py|strict_prompt_guard.py|clinic_info.py|tests/real_wazzup_regression_*.py)
                ;;
              *)
                echo "Forbidden automated repair path: $path"
                FORBIDDEN=1
                ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //; s/.* -> //')

          if [ "$FORBIDDEN" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Repair discarded because it touched protected files."
            exit 0
          fi

          TEST_FILES=$(git ls-files --others --exclude-standard 'tests/real_wazzup_regression_*.py' | tr '\n' ' ')
          if [ -z "$TEST_FILES" ]; then
            echo "No new real-Wazzup regression test was created. Discarding changes."
            git reset --hard HEAD
            git clean -fd
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"

      - name: Prove regression fails on untouched main and passes with fix
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          TEST_FILES: ${{ steps.scope.outputs.test_files }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > /tmp/claude-repair.patch

          mkdir -p /tmp/real-regression-tests
          for f in $TEST_FILES; do
            mkdir -p "/tmp/real-regression-tests/$(dirname "$f")"
            cp "$f" "/tmp/real-regression-tests/$f"
          done

          git reset --hard HEAD
          git clean -fd
          for f in $TEST_FILES; do
            mkdir -p "$(dirname "$f")"
            cp "/tmp/real-regression-tests/$f" "$f"
          done

          set +e
          python -m pytest -q $TEST_FILES
          BASELINE_RC=$?
          set -e
          if [ "$BASELINE_RC" -eq 0 ]; then
            echo "Regression test already passes on current main. Bug is not proven; no repair PR."
            exit 78
          fi

          git reset --hard HEAD
          git clean -fd
          git apply --index /tmp/claude-repair.patch

          python -m pytest -q $TEST_FILES

      - name: Run deterministic nearby contracts
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          python -m py_compile dialog.py ai.py bot_tools.py language_guard.py strict_prompt_guard.py clinic_info.py
          python -m pytest -q \
            tests/test_contraindications_never_silent.py \
            tests/test_brain_before_keyword_branches.py \
            tests/test_answer_language_and_shape.py \
            tests/test_bilingual_hallucination_guards.py \
            tests/test_bilingual_language_guard.py \
            tests/test_booking_for_relative.py \
            tests/test_wazzup_channel_mismatch.py \
            tests/test_faq_not_blocked_by_step_repair.py
          python tests/run_golden.py

      - name: Open draft repair PR, never merge automatically
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="claude/real-wazzup-${GITHUB_RUN_ID}"
          git config user.name "Claude Real Wazzup Repair"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: repair reproduced real Wazzup regression"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "fix: reproduced real Wazzup production regression" \
            --body "Automated repair from a real production Wazzup case during the 20:00-08:00 Asia/Almaty window.\n\nSafety proof performed by GitHub Actions:\n- a new regression test was created from the actual production event sequence;\n- that test FAILED against untouched current main;\n- the same test PASSED after the minimal fix;\n- protected CRM/Wazzup/webhook/Railway/config files were not modified;\n- deterministic nearby contract tests and the golden suite passed.\n\nNo raw phone number, patient identity, API key, or unredacted production payload is included in this PR.\n\nThis PR is intentionally DRAFT and is never auto-merged."
