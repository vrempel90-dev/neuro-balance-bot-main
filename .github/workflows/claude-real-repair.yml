name: Claude Real Wazzup Repair

on:
  schedule:
    # Asia/Almaty is UTC+5. Check every 5 minutes only during 20:00-07:59 local.
    - cron: "*/5 15-23 * * *"
    - cron: "*/5 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-real-wazzup-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_REPAIR_GATEWAY_URL: https://neuro-claude-repair-production.up.railway.app
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce 20:00-08:00 Asia/Almaty window
        id: window
        shell: bash
        run: |
          ACTIVE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          h = datetime.now(ZoneInfo("Asia/Almaty")).hour
          print("true" if h >= 20 or h < 8 else "false")
          PY
          )
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Skip while another automated repair PR is open
        if: steps.window.outputs.active == 'true'
        id: existing
        shell: bash
        run: |
          COUNT=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/real-wazzup-"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token for Railway gateway
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        shell: bash
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=neuro-claude-repair")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")
          echo "::add-mask::$TOKEN"
          echo "CLAUDE_GATEWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Read Claude-reviewed REAL NEW-LEAD bugs
        if: steps.window.outputs.active == 'true' && steps.existing.outputs.count == '0'
        id: cases
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${CLAUDE_GATEWAY_TOKEN}" \
            "${CLAUDE_REPAIR_GATEWAY_URL}/live-cases" \
            -o /tmp/neuro-live-cases.json
          COUNT=$(python -c 'import json; print(int(json.load(open("/tmp/neuro-live-cases.json"))["count"]))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "actionable=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Claude-reviewed new-lead bug cases: $COUNT"

      - name: Set up Python
        if: steps.cases.outputs.actionable == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        if: steps.cases.outputs.actionable == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Set up Node
        if: steps.cases.outputs.actionable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.cases.outputs.actionable == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Let Claude reproduce and fix only the reviewed real case
        if: steps.cases.outputs.actionable == 'true'
        shell: bash
        env:
          ANTHROPIC_BASE_URL: ${{ env.CLAUDE_REPAIR_GATEWAY_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ env.CLAUDE_GATEWAY_TOKEN }}
        run: |
          unset ANTHROPIC_API_KEY || true
          cat /tmp/neuro-live-cases.json | claude -p "$(cat .github/claude-real-repair-prompt.md)

ADDITIONAL HARD RULE: input contains only Claude-reviewed real NEW-LEAD cases. Work on the first case only. Create exactly one new tests/real_wazzup_regression_*.py test derived from that case. Do not patch anything until you have written the test." \
            --permission-mode acceptEdits \
            --max-turns 24 \
            --output-format text \
            --allowedTools \
              "Read" "Edit" "Write" "Grep" "Glob" \
              "Bash(python:*)" "Bash(pytest:*)" "Bash(git diff:*)" "Bash(git status:*)" \
            | tee /tmp/claude-repair-result.txt

      - name: Enforce repair scope
        if: steps.cases.outputs.actionable == 'true'
        id: scope
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FORBIDDEN=0
          while IFS= read -r path; do
            case "$path" in
              dialog.py|ai.py|bot_tools.py|language_guard.py|strict_prompt_guard.py|clinic_info.py|tests/real_wazzup_regression_*.py) ;;
              *) echo "Forbidden automated repair path: $path"; FORBIDDEN=1 ;;
            esac
          done < <(git status --porcelain | sed -E 's/^.. //; s/.* -> //')
          if [ "$FORBIDDEN" -ne 0 ]; then
            git reset --hard HEAD; git clean -fd
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TEST_FILES=$(git ls-files --others --exclude-standard 'tests/real_wazzup_regression_*.py' | tr '\n' ' ')
          if [ -z "$TEST_FILES" ]; then
            git reset --hard HEAD; git clean -fd
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"

      - name: Prove regression fails on untouched main and passes with fix
        if: steps.scope.outputs.changed == 'true'
        id: proof
        shell: bash
        env:
          TEST_FILES: ${{ steps.scope.outputs.test_files }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > /tmp/claude-repair.patch
          mkdir -p /tmp/real-regression-tests
          for f in $TEST_FILES; do mkdir -p "/tmp/real-regression-tests/$(dirname "$f")"; cp "$f" "/tmp/real-regression-tests/$f"; done
          git reset --hard HEAD; git clean -fd
          for f in $TEST_FILES; do mkdir -p "$(dirname "$f")"; cp "/tmp/real-regression-tests/$f" "$f"; done
          set +e
          python -m pytest -q $TEST_FILES
          BASELINE_RC=$?
          set -e
          if [ "$BASELINE_RC" -eq 0 ]; then
            echo "proven=false" >> "$GITHUB_OUTPUT"
            git reset --hard HEAD; git clean -fd
            exit 0
          fi
          git reset --hard HEAD; git clean -fd
          git apply --index /tmp/claude-repair.patch
          python -m pytest -q $TEST_FILES
          echo "proven=true" >> "$GITHUB_OUTPUT"

      - name: Run deterministic nearby contracts
        if: steps.proof.outputs.proven == 'true'
        run: |
          python -m py_compile dialog.py ai.py bot_tools.py language_guard.py strict_prompt_guard.py clinic_info.py
          python -m pytest -q \
            tests/test_contraindications_never_silent.py \
            tests/test_brain_before_keyword_branches.py \
            tests/test_answer_language_and_shape.py \
            tests/test_bilingual_hallucination_guards.py \
            tests/test_bilingual_language_guard.py \
            tests/test_booking_for_relative.py \
            tests/test_wazzup_channel_mismatch.py \
            tests/test_faq_not_blocked_by_step_repair.py
          python tests/run_golden.py

      - name: Open draft repair PR, never merge automatically
        if: steps.proof.outputs.proven == 'true'
        shell: bash
        run: |
          CASE_ID=$(python -c 'import json; print(json.load(open("/tmp/neuro-live-cases.json"))["cases"][0]["case_id"])')
          BRANCH="claude/real-wazzup-${CASE_ID}-${GITHUB_RUN_ID}"
          git config user.name "Claude Real Wazzup Repair"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: repair reproduced real new-lead Wazzup regression"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --draft \
            --title "fix: real new-lead Wazzup regression" \
            --body "Automated repair from a REAL NEW CLIENT Wazzup case. Claude reviewer flagged the case first; GitHub then proved the new regression test FAILS on untouched main and PASSES with this minimal fix. Protected CRM/Wazzup/webhook/Railway/config files were not modified. This PR is DRAFT and is never auto-merged."
