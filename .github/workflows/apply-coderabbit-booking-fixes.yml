name: Apply verified CodeRabbit booking fixes

on:
  push:
    branches:
      - refactor/polyglot-brain-contract

concurrency:
  group: coderabbit-booking-fix
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ''
      CRM_BOT_SECRET: test
      CRM_BASE_URL: http://127.0.0.1:9

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dialog.py")
          text = path.read_text(encoding="utf-8")

          parse_start = text.index("def _parse_date(text: str) -> str | None:")
          parse_end = text.index("\ndef _time_from_text", parse_start)
          if "month_aliases = {" not in text[parse_start:parse_end]:
              numeric_marker = '    m = re.search(r"\\b(\\d{1,2})[.\\-/](\\d{1,2})'
              numeric_pos = text.index(numeric_marker, parse_start, parse_end)
              named_lines = [
                  '    month_aliases = {',
                  '        "январь": 1, "января": 1, "февраль": 2, "февраля": 2,',
                  '        "март": 3, "марта": 3, "апрель": 4, "апреля": 4,',
                  '        "май": 5, "мая": 5, "июнь": 6, "июня": 6,',
                  '        "июль": 7, "июля": 7, "август": 8, "августа": 8,',
                  '        "сентябрь": 9, "сентября": 9, "октябрь": 10, "октября": 10,',
                  '        "ноябрь": 11, "ноября": 11, "декабрь": 12, "декабря": 12,',
                  '        "қаңтар": 1, "кантар": 1, "ақпан": 2, "акпан": 2, "наурыз": 3,',
                  '        "сәуір": 4, "сауир": 4, "мамыр": 5, "маусым": 6,',
                  '        "шілде": 7, "шилде": 7, "тамыз": 8,',
                  '        "қыркүйек": 9, "кыркүйек": 9, "кыркуйек": 9,',
                  '        "қазан": 10, "казан": 10, "қараша": 11, "караша": 11,',
                  '        "желтоқсан": 12, "желтоксан": 12,',
                  '    }',
                  '    named = re.search(r"\\b(\\d{1,2})\\s+([^\\W\\d_]+)(?:\\s+(\\d{4}))?\\b", low, flags=re.UNICODE)',
                  '    if named:',
                  '        day_raw, month_word, year_raw = named.groups()',
                  '        month_word = month_word.strip().lower().replace("ё", "е")',
                  '        month = month_aliases.get(month_word)',
                  '        if month is None:',
                  '            suffixes = ("да", "де", "та", "те", "дың", "дің", "тың", "тің")',
                  '            for alias, number in month_aliases.items():',
                  '                if month_word.startswith(alias) and month_word[len(alias):] in suffixes:',
                  '                    month = number',
                  '                    break',
                  '        if month is not None:',
                  '            day = int(day_raw)',
                  '            if year_raw:',
                  '                try:',
                  '                    return datetime(int(year_raw), month, day).date().isoformat()',
                  '                except ValueError:',
                  '                    return None',
                  '            for year_offset in range(0, 5):',
                  '                try:',
                  '                    candidate = datetime(today.year + year_offset, month, day).date()',
                  '                except ValueError:',
                  '                    continue',
                  '                if candidate >= today:',
                  '                    return candidate.isoformat()',
                  '            return None',
                  '',
              ]
              text = text[:numeric_pos] + "\n".join(named_lines) + "\n" + text[numeric_pos:]

          select_marker = "\ndef _select_slot(text: str, slots: list[dict[str, str]]) -> dict[str, str] | None:\n"
          select_pos = text.index(select_marker)
          if "def _is_single_slot_confirmation(text: str) -> bool:" not in text:
              helper_lines = [
                  '',
                  'def _is_single_slot_confirmation(text: str) -> bool:',
                  '    """Accept exact natural consent only for a single CRM slot."""',
                  '    low = _low(text).replace("ё", "е")',
                  '    normalized = re.sub(r"[^\\w]+", " ", low, flags=re.UNICODE).strip()',
                  '    normalized = re.sub(r"\\s+", " ", normalized)',
                  '    if not normalized:',
                  '        return False',
                  '    negative_markers = (',
                  '        "не подходит", "не надо", "не нужно", "не хочу", "не это время",',
                  '        "другое время", "другой день", "другую дату", "другой вариант",',
                  '        "басқа уақыт", "баска уакыт", "басқа күн", "баска кун",',
                  '        "жоқ", "жок", "керек емес",',
                  '    )',
                  '    if any(marker in normalized for marker in negative_markers):',
                  '        return False',
                  '    confirmations = {',
                  '        "да", "давайте", "да подходит", "подходит", "мне подходит",',
                  '        "запишите", "запишите меня", "да запишите", "хорошо", "ок", "окей",',
                  '        "на это время", "это время подходит", "беру", "согласен", "согласна",',
                  '        "иә", "ия", "болады", "жарайды", "келісемін", "келисемин",',
                  '        "осы уақыт", "осы уакыт", "осы уақытқа", "осы уакытка",',
                  '        "жазыңыз", "жазып қойыңыз", "жазып коиниз",',
                  '    }',
                  '    return normalized in confirmations',
                  '',
              ]
              text = text[:select_pos] + "\n".join(helper_lines) + text[select_pos:]

          select_start = text.index("def _select_slot(text: str, slots: list[dict[str, str]]) -> dict[str, str] | None:")
          select_end = text.index("\ndef _explicit_slot_selection_text", select_start)
          if "len(slots) == 1 and _is_single_slot_confirmation(text)" not in text[select_start:select_end]:
              low_marker = "    low = _low(text)\n"
              low_pos = text.index(low_marker, select_start, select_end) + len(low_marker)
              logic_lines = [
                  '',
                  '    if len(slots) == 1 and _is_single_slot_confirmation(text):',
                  '        only = slots[0]',
                  '        if (',
                  '            isinstance(only, dict)',
                  '            and not _is_reserve_slot(only)',
                  '            and _slot_date(only)',
                  '            and _slot_time(only)',
                  '            and _slot_doctor_login(only)',
                  '            and _slot_doctor_name(only)',
                  '        ):',
                  '            return only',
                  '',
              ]
              text = text[:low_pos] + "\n".join(logic_lines) + text[low_pos:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile changed module
        run: python -m py_compile dialog.py

      - name: Run CodeRabbit conversion contract
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_coderabbit_booking_conversion_contract.py 2>&1 | tee /tmp/coderabbit-tests.log

      - name: Run neighboring booking contracts
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_production_booking_flow.py \
            tests/test_polyglot_slot_contract.py \
            tests/test_polyglot_change_of_mind_contract.py \
            tests/test_polyglot_anti_loop_contract.py 2>&1 | tee /tmp/neighbor-tests.log

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-coderabbit-booking-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dialog.py .github/workflows/apply-coderabbit-booking-fixes.yml
          git diff --cached --check
          git commit -m "fix: close booking conversion gaps found by CodeRabbit"
          git push origin HEAD:refactor/polyglot-brain-contract

      - name: Report failure without changing production code
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "One-shot CodeRabbit repair did not commit production changes because a patch/test step failed."
            echo
            echo '```text'
            tail -80 /tmp/coderabbit-tests.log 2>/dev/null || true
            tail -80 /tmp/neighbor-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/failure.md
          gh pr comment 90 --body-file /tmp/failure.md
