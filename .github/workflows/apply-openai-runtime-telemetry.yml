name: Apply OpenAI runtime telemetry

on:
  push:
    branches:
      - refactor/polyglot-brain-contract
  pull_request:
    branches:
      - main

concurrency:
  group: openai-runtime-telemetry
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: test-key
      CRM_BOT_SECRET: test
      CRM_BASE_URL: http://127.0.0.1:9

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded telemetry migration
        run: python scripts/apply_openai_runtime_telemetry.py

      - name: Compile protected modules
        run: python -m py_compile ai.py ai_budget.py dialog.py main.py state.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: OpenAI telemetry contract
        run: pytest -q tests/test_openai_runtime_telemetry_contract.py

      - name: AI budget contract
        run: pytest -q tests/test_ai_budget_enforcement.py

      - name: Core brain regressions
        run: |
          pytest -q tests/test_prompt_source_of_truth_contract.py
          pytest -q tests/test_brain_language_contract.py
          pytest -q tests/test_bilingual_hallucination_guards.py
          pytest -q tests/test_polyglot_anti_loop_contract.py
          pytest -q tests/test_polyglot_slot_contract.py

      - name: Remove one-shot migration machinery
        run: |
          rm -f scripts/apply_openai_runtime_telemetry.py
          rm -f .github/workflows/apply-openai-runtime-telemetry.yml

      - name: Commit verified telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: expose OpenAI runtime usage telemetry"
          git pull --rebase origin refactor/polyglot-brain-contract
          git push origin HEAD:refactor/polyglot-brain-contract
