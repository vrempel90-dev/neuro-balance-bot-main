name: Apply booking truth recovery

on:
  push:
    branches:
      - refactor/polyglot-brain-contract
  pull_request:
    branches:
      - main

concurrency:
  group: apply-booking-truth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: test-key
      CRM_BOT_SECRET: test
      CRM_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/polyglot-brain-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded migration
        run: python scripts/apply_booking_truth_recovery.py
      - name: Compile
        run: python -m py_compile dialog.py tests/test_production_booking_flow.py tests/test_booking_failure_truth_contract.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Booking truth and race contract
        run: pytest -q tests/test_booking_failure_truth_contract.py
      - name: Existing booking regressions
        run: pytest -q tests/test_production_booking_flow.py
      - name: Slot and reschedule safety
        run: |
          pytest -q tests/test_polyglot_slot_contract.py
          pytest -q tests/test_post_booking_reschedule_contract.py
      - name: Remove one-shot machinery
        run: rm -f scripts/apply_booking_truth_recovery.py .github/workflows/apply-booking-truth.yml
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dialog.py tests/test_production_booking_flow.py tests/test_booking_failure_truth_contract.py
          git add -u scripts/apply_booking_truth_recovery.py .github/workflows/apply-booking-truth.yml
          git commit -m "fix: make booking failures truthful and recover slot races" || exit 0
          git pull --rebase origin refactor/polyglot-brain-contract
          git push origin HEAD:refactor/polyglot-brain-contract
